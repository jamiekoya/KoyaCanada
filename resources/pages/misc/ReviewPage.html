<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../../css/styles_body.css">
  <title>Reviews | Koya Collection</title>

  <style>
    body {
      color: #fff;
      font-family: 'Source Code Pro', monospace;
      margin: 0;
      padding: 0;
    }

    .review-container {
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    .review-container h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .review-container h2 {
      font-size: 1.5rem;
      margin-top: 40px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .review-container p,
    .review-container ul {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 15px;
      text-align: left; 
    }

    .review-form {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      text-align: left;
    }

    .review-form label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .review-form input,
    .review-form textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border-radius: 4px;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      background: #ffffff;
      color: #fff;
    }

    .review-form input[type="file"] {
      background: none;
      color: #fff;
      border: none;
      padding: 0;
    }

    .review-form button {
      background: #fff;
      color: #222;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
    }

    .review-form button:hover {
      background: #eee;
    }

    .reviews-list {
      margin-top: 30px;
      text-align: left;
    }

    .review-item {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .review-item img {
      max-width: 120px;
      border-radius: 6px;
      margin-right: 12px;
      vertical-align: middle;
    }

    .review-item .review-content {
      display: inline-block;
      vertical-align: middle;
      max-width: 600px;
    }

    @media (max-width: 768px) {
      .review-container {
        padding: 15px;
        margin: 30px auto;
      }
      .review-container h1 {
        font-size: 2rem;
      }
      .review-container h2 {
        font-size: 1.2rem;
      }
      .review-container p,
      .review-container ul {
        font-size: 0.9rem;
      }
      .review-item .review-content {
        max-width: 100%;
        display: block;
      }
      .review-item img {
        max-width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="review-container">
    <h1>Customer Reviews</h1>
    <p>Share your experience with Koya Collection! Post your review and upload a photo of your item.</p>

    <form class="review-form" id="reviewForm">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required maxlength="40">

      <label for="review">Your Review</label>
      <textarea id="review" name="review" rows="4" required maxlength="500"></textarea>

      <label for="photo">Upload Photo (optional)</label>
      <input type="file" id="photo" name="photo" accept="image/*">

      <button type="submit">Submit Review</button>
    </form>

    <h2>Recent Reviews</h2>
    <div class="reviews-list" id="reviewsList">
      <!-- Reviews will appear here -->
    </div>
  </div>
  <div id="adminDeleteSection" style="position:fixed; bottom:24px; right:24px; z-index:1000; text-align:center; background:rgba(167, 141, 168, 0); padding:18px 20px; border-radius:10px; box-shadow:0 2px 12px rgba(0, 0, 0, 0);">
    <input type="password" id="adminPassword" placeholder="Enter password" maxlength="20" style="margin:8px 0; padding:6px; border-radius:4px; border:none; background:#22222200; color:#ffffff00;">
    <button id="adminLoginBtn" style="background:#ffffff00; color:hsla(314, 23%, 62%, 0); border:none; padding:8px 18px; border-radius:4px; font-size:1rem; cursor:pointer;">Login</button>
    <div id="deleteModeMsg" style="margin-top:12px; color:rgba(255, 255, 187, 0); display:none;">Delete mode enabled.</div>
  </div>
  <script>
    let deleteMode = false;

    document.getElementById('adminLoginBtn').onclick = function() {
      const pw = document.getElementById('adminPassword').value;
      if (pw === 'Boo') {
        deleteMode = true;
        document.getElementById('deleteModeMsg').style.display = 'block';
        document.getElementById('adminPassword').value = '';
      } else {
        alert('Incorrect password.');
      }
    };

    document.getElementById('reviewsList').addEventListener('click', function(e) {
      if (!deleteMode) return;
      let reviewItem = e.target.closest('.review-item');
      if (!reviewItem) return;

      if (confirm('Delete this review?')) {
        // Find review index
        const reviews = JSON.parse(localStorage.getItem('reviews') || '[]');
        const items = Array.from(document.querySelectorAll('.review-item'));
        const idx = items.indexOf(reviewItem);
        if (idx > -1) {
          reviews.splice(reviews.length - 1 - idx, 1); // reviews are prepended
          localStorage.setItem('reviews', JSON.stringify(reviews));
          reviewItem.remove();
        }
      }
    });
  </script>
  <script>
    // Persistent review storage using localStorage
    const form = document.getElementById('reviewForm');
    const reviewsList = document.getElementById('reviewsList');

    // Load reviews from localStorage on page load
    window.addEventListener('DOMContentLoaded', function() {
      const reviews = JSON.parse(localStorage.getItem('reviews') || '[]');
      reviews.forEach(r => addReview(r.name, r.review, r.photoURL));
    });

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = form.name.value.trim();
      const review = form.review.value.trim();
      const photoInput = form.photo;
      let photoURL = '';

      if (photoInput.files && photoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          photoURL = evt.target.result;
          saveReview(name, review, photoURL);
          addReview(name, review, photoURL);
        };
        reader.readAsDataURL(photoInput.files[0]);
      } else {
        saveReview(name, review, '');
        addReview(name, review, '');
      }

      form.reset();
    });

    function saveReview(name, review, photoURL) {
      const reviews = JSON.parse(localStorage.getItem('reviews') || '[]');
      reviews.unshift({ name, review, photoURL });
      localStorage.setItem('reviews', JSON.stringify(reviews));
    }

    function addReview(name, review, photoURL) {
      const div = document.createElement('div');
      div.className = 'review-item';

      let html = '';
      if (photoURL) {
        html += `<img src="${photoURL}" alt="Review photo">`;
      }
      html += `<div class="review-content"><strong>${name}</strong><br>${review}</div>`;
      div.innerHTML = html;

      reviewsList.prepend(div);
    }
  </script>
</body>
</html>

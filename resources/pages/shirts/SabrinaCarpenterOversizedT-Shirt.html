<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/styles_body.css">
    <title>Sabrina Carpenter Short And Sweet - Oversized T-shirt</title>
</head>
<script src="https://www.paypalobjects.com/ncp/cart/cart.js" data-merchant-id="9UP8YVT58Q3Z2"></script>
<body>
    <paypal-cart-button data-id="pp-view-cart"></paypal-cart-button>
    <script>
        cartPaypal.Cart({ id: "pp-view-cart" })
    </script>

    <paypal-add-to-cart-button data-id="3BFDYKXS7S76S"></paypal-add-to-cart-button>
</body>

<script>
  cartPaypal.AddToCart({ id: "3BFDYKXS7S76S" })
</script>
    <!-- Currency Selector -->
    <div style="text-align: right; margin-bottom: 20px;">
        <label for="currency-select">View prices in:</label>
        <select id="currency-select">
          <option value="CAD" selected>CAD</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="NZD">NZD</option>
        </select>
    </div>
    <!-- Product Price (for currency conversion) -->
    <div class="project-card">
        <span class="price" data-cad-price="50">$50.00 CAD</span>
    </div>
    <script>
    const rates = {
        CAD: 1,
        USD: 0.73,
        EUR: 0.67,
        GBP: 0.57,
        NZD: 1.20
    };
    const currencySymbols = {
        CAD: '$',
        USD: '$',
        EUR: '€',
        GBP: '£',
        NZD: '$'
    };
    function updatePrices() {
        const currency = document.getElementById('currency-select').value;
        document.querySelectorAll('.project-card').forEach(card => {
          const priceEl = card.querySelector('.price');
          if (!priceEl) return;
          // Store original CAD price in a data attribute if not already set
          if (!priceEl.dataset.cadPrice) {
            const cadPrice = parseFloat(priceEl.textContent.replace(/[^0-9.]/g, ''));
            if (!isNaN(cadPrice)) {
                priceEl.dataset.cadPrice = cadPrice;
            }
          }
          const cadPrice = parseFloat(priceEl.dataset.cadPrice);
          if (isNaN(cadPrice)) return;
          const converted = (cadPrice * rates[currency]).toFixed(2);
          priceEl.textContent = `${currencySymbols[currency]}${converted} ${currency}`;
        });
    }
    document.getElementById('currency-select').addEventListener('change', updatePrices);
    // Initial update
    updatePrices();
    </script>
</html>

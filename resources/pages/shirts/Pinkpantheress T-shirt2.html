<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PinkPantheress - Oversized T-shirt</title>

  <link rel="stylesheet" href="../../css/styles_body.css">
  <link rel="stylesheet" href="../../css/styles_home.css">
  <link rel="stylesheet" href="../../css/styles_product.css">
</head>
<body>
  <!-- PayPal cart script -->
  <script src="https://www.paypalobjects.com/ncp/cart/cart.js" data-merchant-id="9UP8YVT58Q3Z2"></script>

  <div class="product-page">

    <div class="item-container">
      <div class="item-image-container">
        <img src="https://koyacanadawebsite.blob.core.windows.net/websiteimages/Pink Pantheress T-Shirt Front.png"
             alt="Pink Pantheress Oversized T-shirt Front" class="item-image">
        <img src="https://koyacanadawebsite.blob.core.windows.net/websiteimages/Pink Pantheress T-Shirt Back.png"
             alt="Pink Pantheress Oversized T-shirt Back" class="item-image-hover">
      </div>
      <!-- <h1 class="item-title">Elvira - Mistress of the Dark Oversized T-shirt</h1> -->

      <p class="item-description">
        My name is Pink and I'm really glad to meet you. This shirt is recommended by some people.  Oversized and vintage/acid washed to perfection.
      </p>

    <paypal-add-to-cart-button data-id="LF42PZSX6ZKZ2"></paypal-add-to-cart-button>
    <script>
        cartPaypal.AddToCart({ id: "LF42PZSX6ZKZ2" })
    </script>

      <!-- Currency Selector -->
      <div class="currency-row">
        <label for="currency-select">View prices in:</label>
        <select id="currency-select" class="currency-select">
          <option value="CAD" selected>CAD</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="NZD">NZD</option>
        </select>
      </div>

      <div class="product-toolbar-row">

        <div class="project-card">
            <span class="price" data-cad-price="50">$50.00 CAD</span>
        </div>

        <div class="product-toolbar">
            <paypal-cart-button data-id="pp-view-cart"></paypal-cart-button>
            <script> cartPaypal.Cart({ id: "pp-view-cart" }) </script>
        </div>
      </div>
    </div>
  </div>

  <!-- Currency script -->
  <script>
    const rates = { CAD:1, USD:.73, EUR:.67, GBP:.57, NZD:1.20 };
    const currencySymbols = { CAD:'$', USD:'$', EUR:'€', GBP:'£', NZD:'$' };

    function updatePrices() {
      const currency = document.getElementById('currency-select').value;
      document.querySelectorAll('.project-card .price').forEach(priceEl => {
        const cad = parseFloat(priceEl.dataset.cadPrice);
        if (!isNaN(cad)) {
          const converted = (cad * (rates[currency] || 1)).toFixed(2);
          priceEl.textContent = `${currencySymbols[currency] || ''}${converted} ${currency}`;
        }
      });
    }
    document.getElementById('currency-select').addEventListener('change', updatePrices);
    updatePrices();
  </script>
</body>
</html>
